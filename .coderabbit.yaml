# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Be direct and concise. Focus on correctness, security, architecture, idioms, and consistency."
early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    Create concise release notes as a bullet-point list, but only if the
    original PR body is insufficient or inaccurate. Extend or clarify the
    PR body content; don't duplicate it.
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  request_changes_workflow: false
  commit_status: true
  review_status: false
  poem: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false

  path_filters:
    # Screenshots and other binary docs assets
    - "!docs/**/*.png"

  path_instructions:
    - path: "**/*.qml"
      instructions: |
        QML for a DankMaterialShell (Quickshell) dankbar plugin. DMS loads these
        files at runtime; there is no build step and no test suite, so a mistake
        here surfaces only as a silently broken widget. Review for:
        - Imports of `qs.Common`, `qs.Services`, `qs.Widgets`, `qs.Modules.Plugins`
          resolve ONLY inside the DMS runtime. Never suggest local stubs, module
          paths, or vendoring them.
        - Colors, spacing, and radii must come from `Theme.*` tokens, never
          literals. Bar content must be sized with `Theme.barIconSize(...)` /
          `Theme.barTextSize(...)`, never a fixed `Theme.iconSize`, which renders
          tiny at a non-default iconScale.
        - Prefer DMS-provided widgets (`StyledText`, `DankIcon`, `PopoutComponent`,
          `PluginComponent`) over hand-rolled equivalents.
        - Reads of niri state via `NiriService` must be null-safe. `allWorkspaces`,
          `windows`, and `layout.pos_in_scrolling_layout` can all be absent or
          empty; the widget must degrade rather than throw.
        - A settings pane must declare `pluginId` itself and it must match
          `plugin.json`'s `id`. A wrong literal silently resolves against another
          plugin with no error anywhere.
        - Flag property bindings with side effects, and `Repeater` delegates
          missing `required property` declarations.
        - Duplicated markup across the bar pill and the popout should be factored
          into a shared component rather than copied.
    - path: "plugin.json"
      instructions: |
        DMS plugin manifest. Review for:
        - `id` must match the directory name DMS installs into; changing it is a
          breaking rename for existing users.
        - Every path in `component` and `settings` must point at a file that
          exists. A stale path leaves the plugin unloadable with no clear error.
        - `permissions` should be the minimum the widget actually uses.
        - `version` follows semver and is the source of truth for release tags.
        - `requires_dms` must be bumped when the code starts depending on a newer
          DMS API.
    - path: "justfile"
      instructions: |
        Task runner for the dev loop. Review for:
        - Shell recipes use `set -euo pipefail`.
        - Recipes must never delete an installed plugin copy; move it aside so
          local changes are recoverable.
        - No hardcoded home paths; honor `XDG_CONFIG_HOME` with a `$HOME/.config`
          fallback.
    - path: "README.md"
      instructions: |
        User-facing documentation. Review for accuracy against `plugin.json` —
        especially the plugin id in install instructions, the `requires_dms`
        floor, and any documented settings that must actually exist.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    drafts: false
    base_branches:
      - "main"

  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
